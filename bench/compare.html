<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Task Comparison</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mut:#5f5e58;--line:#e3e1d9;--soft:#efede6;--you:#e4ecfb;--link:#1f62c9;--amber:#8a5d00;--green:#17744d;--red:#b3261e;
 --c0:#c2571a;--c1:#2a6fdb;--c2:#8a3ffc;--c3:#17805a;--c4:#b0306a;--c5:#0f7f8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191917;--card:#232321;--ink:#ecebe6;--mut:#a9a89f;--line:#393833;--soft:#2e2d2a;--you:#26324a;--link:#83b0f5;--amber:#e0b050;--green:#5fcb9c;--red:#f08a82;--c0:#ec8a52;--c1:#6ba1f2;--c2:#b78cff;--c3:#4fc397;--c4:#ee7fb0;--c5:#54c4d2}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--link)}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar strong{font-size:15px;margin-right:auto}
.group{display:flex;gap:4px;flex-wrap:wrap}
.bar button{font:inherit;font-size:13px;min-height:32px;padding:4px 10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1500px;margin:0 auto}
nav{position:sticky;top:53px;align-self:start;height:calc(100vh - 53px);overflow-y:auto;padding:16px 12px 40px 16px;border-right:1px solid var(--line);font-size:13px}
nav a{display:block;text-decoration:none;color:var(--mut);padding:3px 6px;border-radius:4px;line-height:1.3}
nav a.nt{color:var(--ink);font-weight:600;margin-top:12px}nav a.ns{padding-left:14px}
nav a.on{background:var(--soft);color:var(--ink)}
main{padding:20px 24px 80px;min-width:0}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}.lede{color:var(--mut);margin:0 0 14px;max-width:72ch}
h2{font-size:22px;line-height:1.25;margin:0 0 6px}h3{font-size:16px;margin:0}h4{font-size:15px;margin:0}
.task{margin-top:44px;padding-top:20px;border-top:3px solid var(--line)}
.goal{margin:0 0 6px;max-width:80ch}.rubric,.open,.note{font-size:13.5px;color:var(--mut);margin:0 0 10px;max-width:90ch}
.open b,.rubric b{color:var(--ink);margin-right:4px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;background:var(--card);font-size:13.5px;width:100%}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--soft);font-weight:600}
.who{white-space:nowrap;font-weight:600}
.board{margin:8px 0 6px}.board th[scope=row] a{color:var(--ink);text-decoration:none;font-weight:600}.board th[scope=row]{background:var(--card);font-weight:400}
.board th span{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.board td{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}.board td a{display:block;text-decoration:none;color:var(--ink);font-weight:600}.board td.pend a{color:var(--mut);font-weight:400}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}%DOTS%
.step{margin-top:26px}.sh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:8px}
.sc{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut)}.sc b{color:var(--ink)}
.prompt{background:var(--you);border-radius:8px;padding:10px 13px;margin:0 0 10px;font-size:14px;max-width:90ch}.lab{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}
.agents{display:grid;gap:12px}
body[data-layout=side] .agents{grid-template-columns:repeat(var(--cols,%COLS%),minmax(280px,1fr));overflow-x:auto;align-items:start}
.agent{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;scroll-margin-top:64px}
.agent header{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.facts{font-size:12.5px;color:var(--mut);margin-left:auto}
.m{padding:7px 0}.m+.m{border-top:1px dashed var(--line)}.m.m-user{background:var(--you);border:0;border-radius:7px;padding:7px 10px;margin:5px 0}
.meta{font-size:12px;color:var(--mut);margin-bottom:2px}.sent{font-size:12px;color:var(--mut);padding:2px 0}
.m p{margin:0 0 6px}.m p:last-child{margin-bottom:0}.m ul,.m ol{margin:0 0 6px;padding-left:20px}.m .mh{font-weight:600}.m a{overflow-wrap:anywhere}
.m table{margin:4px 0 8px;font-size:13px}
.tag{margin-left:7px;font-weight:600}.tag.late{color:var(--amber)}.tag.unp{color:var(--green)}
.none{color:var(--mut);font-style:italic;margin:0}
.att{display:block;max-width:240px;max-height:260px;border:1px solid var(--line);border-radius:6px;margin-top:5px}.file{display:inline-block;font-size:13px;margin-top:3px}
.saved{font-size:13px;color:var(--mut);margin-top:8px}.saved summary{cursor:pointer}.saved ul{margin:4px 0;padding-left:18px}.bad{color:var(--red)}
.foot{font-size:13px;color:var(--mut);max-width:90ch}
[hidden]{display:none!important}
@media (max-width:900px){.wrap{display:block}nav{display:none}main{padding:16px 16px 60px}.bar{position:static}html{scroll-padding-top:12px}.agent{scroll-margin-top:12px}.facts{margin-left:0;width:100%}#lay{display:none}
 body[data-layout=side] .agents{display:grid;grid-template-columns:1fr}}
</style></head><body data-layout="stack">
<div class="bar"><strong>Agent Task Comparison</strong>
 <div class="group" id="fil" role="group" aria-label="Show agent"><button data-f="all" aria-pressed="true">All agents</button>%CHIPS%</div>
 <div class="group" id="lay" role="group" aria-label="Layout"><button data-l="stack" aria-pressed="true">One by one</button><button data-l="side" aria-pressed="false">Side by side</button></div>
</div>
<div class="wrap"><nav aria-label="Tasks">%NAV%</nav><main>
<h1>Every task, agent by agent</h1>
<p class="lede">%LEDE%</p>
%BOARD%
<p class="foot">%FOOT%</p>
%BODY%
</main></div>
<script>
const b=document.body;
function setF(f){document.querySelectorAll('#fil button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===f));
 document.querySelectorAll('[data-a]').forEach(e=>{e.hidden=f!=='all'&&e.dataset.a!==f});
 document.documentElement.style.setProperty('--cols',f==='all'?%COLS%:1);}
function setL(l){b.dataset.layout=l;document.querySelectorAll('#lay button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===l));try{localStorage.setItem('layout',l)}catch(e){}}
document.getElementById('fil').onclick=e=>{const t=e.target.closest('button');if(t)setF(t.dataset.f)};
document.getElementById('lay').onclick=e=>{const t=e.target.closest('button');if(t)setL(t.dataset.l)};
try{const s=localStorage.getItem('layout');if(s)setL(s)}catch(e){}
const links=[...document.querySelectorAll('nav a')],map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('on'));const a=map.get(e.target.id);if(a){a.classList.add('on');a.scrollIntoView({block:'nearest'})}}})},{rootMargin:'-70px 0px -75% 0px'});
document.querySelectorAll('.step,#unprompted').forEach(s=>io.observe(s));
</script></body></html>
